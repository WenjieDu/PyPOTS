version: 2
updates:
  # Routine dependency updates go to dev. Security updates still target main.
  - package-ecosystem: pip
    # The root pip scan already discovers requirements/ manifests.
    directory: /
    # Keep compatible lower bounds; update exact pins when needed.
    versioning-strategy: increase-if-necessary
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      development-tools:
        patterns:
          - ruff
          - pre-commit
          - pytest*
          - build
          - twine
        update-types:
          - minor
          - patch
      documentation-tools:
        patterns:
          - sphinx*
          - furo
          - docutils
          - pygments
          - accessible-pygments
        update-types:
          - minor
          - patch
    # Scientific/runtime dependencies remain individually reviewable.

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github actions
    groups:
      action-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /docker
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - docker
