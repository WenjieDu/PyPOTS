name: "Stale Manager"

on:
  push:
    branches:
      - test_stale_manager
  schedule:
    - cron: "0 8 * * *"

permissions:
  actions: write
  contents: write # only for delete-branch option
  issues: write
  pull-requests: write

jobs:
  issue-manager:
    runs-on: ubuntu-latest
    steps:
      - name: Handle stale items
        uses: actions/stale@v10
        with:
          stale-issue-message: 'This issue is stale because it has been open 30 days with no activity. Remove stale label or comment or this will be closed in 10 days.'
          close-issue-message: 'This issue was closed because it has been stalled for 10 days with no activity.'
          days-before-issue-stale: 30
          days-before-issue-close: 10
          exempt-issue-labels: 'keep,awaiting-approval,work-in-progress,completed'

          stale-pr-message: 'This PR is stale because it has been open 30 days with no activity. Remove stale label or comment or this will be closed in 10 days.'
          close-pr-message: 'This PR was closed because it has been stalled for 10 days with no activity.'
          days-before-pr-stale: 30
          days-before-pr-close: 10
          exempt-pr-labels: 'keep,awaiting-approval,work-in-progress,completed'

      - name: Handle completed items
        uses: actions/stale@v10
        with:
          any-of-issue-labels: 'completed'
          stale-issue-message: 'This issue is marked as "completed" and has been open 14 days with no activity. It will be closed in 7 days if no further activity occurs.'
          close-issue-message: 'This issue was closed because it has been marked as "completed".'
          days-before-issue-stale: 14
          days-before-issue-close: 7
          close-issue-reason: 'completed'