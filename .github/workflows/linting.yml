name: Linting

on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main, dev]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    ruff-linting:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-python@v6
              with:
                  python-version: '3.13'

            - name: Install lint tools
              run: python -m pip install ruff==0.17.6 pre-commit

            - name: Ruff lint and formatting
              run: |
                  ruff check .
                  ruff format . --check

            - name: Structural checks on all tracked files
              run: |
                  pre-commit run check-yaml --all-files
                  pre-commit run check-toml --all-files
                  pre-commit run check-merge-conflict --all-files

            - name: Pre-commit checks on changed files
              env:
                  BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
              run: |
                  # Existing whitespace debt is not a reason to fail unrelated PRs.
                  if [[ -n "$BASE" && "$BASE" != 0000000000000000000000000000000000000000 ]] && git cat-file -e "$BASE^{commit}"; then
                      pre-commit run --from-ref "$BASE" --to-ref HEAD
                  else
                      echo "No comparison base; structural and Ruff checks ran on all tracked files."
                  fi

            - name: Check CI bootstrap without third-party packages
              run: python -S scripts/ci_pipeline.py install --help

            - name: Documentation consistency (no Sphinx build)
              run: python scripts/check_docs_consistency.py

    workflow-lint:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v6
              with:
                  persist-credentials: false
            - uses: actions/setup-go@v6
              with:
                  go-version: '1.24'
                  cache: false
            - name: Install actionlint
              run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
            - name: Validate workflow definitions
              run: |
                  actionlint -shellcheck=
                  actionlint .github/workflows/{ci_job,testing_ci,testing_nightly,run_examples,linting}.yml
            - name: ShellCheck testing and documentation scripts
              run: shellcheck scripts/build_and_run_sphinx_docs.sh scripts/run_full_test.sh
