name: Resolve linked issues

on:
  pull_request_target:
    branches: [main, dev]
    types: [closed]

permissions:
  issues: write

jobs:
  resolve:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Process the event metadata only; do not check out or execute PR code.
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const repo = context.repo;
            const fullName = `${repo.owner}/${repo.repo}`;
            // Explicit closing directives in the PR description, not incidental
            // references, HTML comments, block quotes, or code examples.
            const keyword = "(?:close[sd]?|fix(?:es|ed)?|resolve[sd]?)";
            const reference = "(?:(?:([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+))?#([1-9][0-9]*)|https://github\\.com/([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)/issues/([1-9][0-9]*))";
            const directive = new RegExp(`^\\s*(?:[-*+]\\s+)?${keyword}\\b`, "i");
            const pattern = new RegExp(`\\b${keyword}\\s*:?\\s+${reference}(?![0-9A-Za-z_/-])`, "gi");
            const numbers = new Set();
            let fence = null;
            for (const line of (pr.body || "").replace(/<!--[\s\S]*?-->/g, "").split(/\r?\n/)) {
              const marker = line.match(/^ {0,3}(`{3,}|~{3,})/);
              if (marker) {
                if (!fence) fence = marker[1];
                else if (marker[1][0] === fence[0] && marker[1].length >= fence.length) fence = null;
                continue;
              }
              if (fence || /^(?: {4}|\t|\s*>)/.test(line) || !directive.test(line)) continue;
              const text = line.replace(/(`+)[^\n]*?\1/g, "");
              for (const match of text.matchAll(pattern)) {
                const targetRepo = match[1] || match[3] || fullName;
                const number = Number(match[2] || match[4]);
                if (targetRepo.toLowerCase() === fullName.toLowerCase() && Number.isSafeInteger(number)) {
                  numbers.add(number);
                }
              }
            }
            if (numbers.size === 0) return;
            // Do not depend on a separate scheduled run initializing the label.
            try {
              await github.rest.issues.getLabel({ ...repo, name: "stale-completed" });
            } catch (error) {
              if (error.status !== 404) throw error;
              try {
                await github.rest.issues.createLabel({
                  ...repo, name: "stale-completed", color: "ededed",
                  description: "Completed issue in its closing grace period",
                });
              } catch (createError) {
                if (createError.status !== 422) throw createError;
                // Another workflow may have created it concurrently.
                await github.rest.issues.getLabel({ ...repo, name: "stale-completed" });
              }
            }
            const protectedLabels = ["keep", "awaiting-approval", "work-in-progress", "security"];
            const staleLabels = ["stale", "stale-question", "stale-reproduction", "stale-completed"];
            for (const issue_number of numbers) {
              const params = { ...repo, issue_number };
              let issue;
              try {
                ({ data: issue } = await github.rest.issues.get(params));
              } catch (error) {
                if (error.status !== 404) throw error;
                core.warning(`Skipping missing issue #${issue_number}`);
                continue;
              }
              if (issue.state !== "open" || issue.locked || issue.pull_request) {
                core.info(`Skipping closed, locked, or non-issue #${issue_number}`);
                continue;
              }
              const labels = issue.labels.map(label => label.name);
              const marker = `<!-- pypots-resolution:pr-${pr.number} -->`;
              const comments = await github.paginate(github.rest.issues.listComments, { ...params, per_page: 100 });
              const protectedIssue = issue.milestone || protectedLabels.some(label => labels.includes(label));
              const targetLabels = protectedIssue ? ["completed"] : ["completed", "stale-completed"];
              const previous = comments.find(comment =>
                comment.user?.login === "github-actions[bot]" && comment.body?.includes(marker)
              );
              if (previous) {
                // Recover a failed label write only if the notification was
                // the last activity. Never restart a timer after user activity.
                if (targetLabels.some(label => !labels.includes(label)) &&
                    previous.created_at && issue.updated_at === previous.created_at) {
                  await github.rest.issues.addLabels({ ...params, labels: targetLabels });
                  core.info(`Recovered label write for issue #${issue_number}`);
                } else {
                  core.info(`Already notified issue #${issue_number} for PR #${pr.number}`);
                }
                continue;
              }
              for (const name of staleLabels) {
                if (labels.includes(name)) await github.rest.issues.removeLabel({ ...params, name });
              }
              const message = [
                `This issue has been resolved by PR #${pr.number}, merged into \`${pr.base.ref}\`.`,
                "Please verify the change and let us know if the problem persists.",
                protectedIssue
                  ? "The issue is protected from automatic closure and will remain open for maintainer review."
                  : "If there is no further activity, this issue will be closed as completed after 7 days. Maintainers can add the `keep` label to keep it open.",
                marker,
              ].join("\n\n");
              // Notify before starting the grace period. Reuse Stale Manager's
              // completed rule, rather than introducing a second closing job.
              await github.rest.issues.createComment({ ...params, body: message });
              await github.rest.issues.addLabels({
                ...params,
                labels: targetLabels,
              });
              core.info(`Marked issue #${issue_number} completed after merging PR #${pr.number}`);
            }
