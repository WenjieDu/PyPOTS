name: Welcome first-time contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    branches: [main, dev]
    types: [opened]

permissions: {}

jobs:
  greeting:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write

    steps:
      # Metadata and comments only. Never check out or run PR-controlled code in this workflow.
      - uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: |
            Hi there 👋,

            Thank you for your first issue in PyPOTS! Please include the affected version, relevant context, and a minimal reproduction for bugs.

            For usage questions, see the [documentation](https://docs.pypots.com/) or join our [Discord community](https://discord.gg/DXpCTdrvCE). Please report security vulnerabilities [privately](https://github.com/WenjieDu/PyPOTS/security/advisories/new).

            Thanks for helping improve PyPOTS!

            The PyPOTS team
          pr_message: |
            Hi there 👋,

            Thank you for your first contribution to PyPOTS! Ordinary contributions should target the dev branch. Please link relevant issues, explain the changes, and include your test results and any compatibility or licensing considerations.

            For new models or major features, please discuss the proposal with maintainers first. See the [developer guide](https://docs.pypots.com/en/latest/dev_getting_started.html) for contribution and testing guidance.

            The PyPOTS team
