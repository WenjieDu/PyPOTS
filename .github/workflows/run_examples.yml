name: Run Examples

on:
    schedule:
        - cron: '0 4 * * 1'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

jobs:
    examples:
        strategy:
            fail-fast: false
            matrix:
                scope: [offline, network]
        uses: ./.github/workflows/ci_job.yml
        with:
            os: ubuntu-latest
            python: '3.11'
            torch: '2.9.0'
            numpy: '2.3.5'
            pandas: '2.3.3'
            suite: ${{ matrix.scope }}
            checkout-ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}
