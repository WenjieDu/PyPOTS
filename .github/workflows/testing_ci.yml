name: CI

on:
    push:
        branches: [main, dev]
    pull_request:
        branches: [main, dev]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    CI-testing:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - python: '3.10'
                      torch: '2.3.0'
                      numpy: '1.26.4'
                      pandas: '2.3.3'
                    - python: '3.14'
                      torch: '2.9.0'
                      numpy: '2.3.5'
                      pandas: '2.3.3'
        uses: ./.github/workflows/ci_job.yml
        with:
            os: ubuntu-latest
            python: ${{ matrix.python }}
            torch: ${{ matrix.torch }}
            numpy: ${{ matrix.numpy }}
            pandas: ${{ matrix.pandas }}
            suite: full
            coverage: ${{ matrix.python == '3.10' }}

    package-validation:
        uses: ./.github/workflows/ci_job.yml
        with:
            os: ubuntu-latest
            python: '3.10'
            torch: '2.3.0'
            numpy: '1.26.4'
            pandas: '2.3.3'
            suite: package
