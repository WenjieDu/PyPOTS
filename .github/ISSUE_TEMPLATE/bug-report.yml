name: "🐞 Bug Report"
description: Report unexpected behavior or an error in PyPOTS.
labels: ["potential bug"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve PyPOTS! Please check the [documentation](https://docs.pypots.com/) and existing issues first.
        Report security vulnerabilities [privately](https://github.com/WenjieDu/PyPOTS/security/advisories/new), not here.

  - type: textarea
    id: system-info
    attributes:
      label: Environment
      description: Include the installed PyPOTS version or commit, Python, OS, PyTorch, relevant dependency versions, and installation method.
      placeholder: |
        PyPOTS:
        Python:
        OS and architecture:
        PyTorch:
        Other relevant dependencies:
        Installation method (pip, conda, Docker, source):
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: Device / execution environment
      description: Select all that apply; include accelerator, driver, CUDA/CANN and distributed setup details in Environment if relevant.
      multiple: true
      options:
        - CPU
        - NVIDIA CUDA GPU
        - Ascend NPU
        - Other accelerator
        - Single-process
        - DataParallel
        - DistributedDataParallel (DDP)
        - Not applicable
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: |
        Provide reproducible code or steps, the model and task, input shape, missingness pattern, and a small synthetic or shareable dataset if relevant.
        Use fenced code blocks for code and logs; redact credentials and sensitive data.
      placeholder: |
        Steps or minimal Python script:
        Input shape and data:
        Command to run:
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: Describe what actually happens, including the full traceback or relevant logs if available.
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context (optional)
      description: Related issues, workarounds, or whether you would like to contribute a fix.
