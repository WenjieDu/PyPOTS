name: "🤔 Other Kinds of Issues"
description: Ask a question or raise an issue not covered by the other forms.
labels: ["question"]

body:
  - type: markdown
    attributes:
      value: |
        For general discussion and usage questions, you can also join our [Discord community](https://discord.gg/DXpCTdrvCE).
        Please check the [documentation](https://docs.pypots.com/) and existing issues first.
        Security vulnerabilities should be [reported privately](https://github.com/WenjieDu/PyPOTS/security/advisories/new).

  - type: textarea
    id: issue-description
    attributes:
      label: Issue or question
      description: Describe what you want to know or discuss. Include the relevant task, model, API, and version where applicable.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: What have you tried? (optional)
      description: Relevant code, documentation, related issues, or additional context. Redact private information.

  - type: textarea
    id: contribution
    attributes:
      label: Additional context (optional)
      description: Any other details or suggestions that may help.
