name: "🙌 Feature Request"
description: Propose a new capability or improvement.
labels: ["new feature", "enhancement"]

body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation and use case
      description: What problem are you trying to solve? Who would benefit, and why is the current API insufficient?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed feature
      description: Describe the desired behavior, example usage, affected tasks or APIs, and expected outcomes.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and related work (optional)
      description: Existing workarounds, comparable libraries, papers, or related issues.

  - type: textarea
    id: contribution
    attributes:
      label: Additional context (optional)
      description: Implementation considerations, compatibility concerns, or whether you would like to help implement the feature.
