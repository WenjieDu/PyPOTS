name: "🤙 New Model Addition"
description: Propose a model or algorithm for inclusion in PyPOTS.
labels: ["new algo", "enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        Please review the [inclusion criteria](https://docs.pypots.com/en/latest/faq.html#inclusion-criteria).
        The usual rule of thumb is at least one year since publication, 20+ citations, and demonstrable usefulness.
        Authors proposing their own new models may qualify for an exception if they commit to maintaining the implementation for at least two years; contact the maintainer as described in the FAQ before starting implementation.

  - type: input
    id: model-name
    attributes:
      label: Model / algorithm name
    validations:
      required: true

  - type: textarea
    id: publication
    attributes:
      label: Paper and evidence
      description: Provide the paper link, publication date/venue, citation count and source, and evidence of usefulness. If no paper is available, explain the basis for inclusion.
    validations:
      required: true

  - type: dropdown
    id: tasks
    attributes:
      label: Supported time-series tasks
      multiple: true
      options:
        - Imputation
        - Forecasting
        - Classification
        - Clustering
        - Anomaly detection
        - Representation learning
        - Other
    validations:
      required: true

  - type: textarea
    id: implementation
    attributes:
      label: Original implementation and license
      description: |
        Provide the official repository and its license (including relevant third-party code or pretrained weights).
        If no implementation or license is available, state that explicitly. Public availability alone does not establish permission to reuse code.
    validations:
      required: true

  - type: textarea
    id: missingness
    attributes:
      label: Partially-observed time-series support
      description: Does the original model handle missing values natively? Describe any proposed adaptation, input/output contract, and relevant limitations.
    validations:
      required: true

  - type: textarea
    id: maintenance
    attributes:
      label: Authors, contributors, and maintenance (optional)
      description: |
        Identify the original authors or potential contributors, your relationship to the model, and any implementation or maintenance plan.
        For the author exception, include the required two-year maintenance commitment.
