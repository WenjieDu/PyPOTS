# https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

formats:
    - htmlzip
    - pdf
    - epub

sphinx:
    configuration: docs/conf.py
    # Keep existing docstring warnings non-blocking until the warning backlog is resolved.
    fail_on_warning: false

build:
    os: ubuntu-22.04

    tools:
        python: "3.10"

    jobs:
        pre_install:
            # Upgrade RTD's bootstrap pip before resolving modern package metadata.
            - python -m pip install --upgrade pip --index-url https://pypi.org/simple
            # Select the exact Linux x86-64 / CPython 3.10 CPU wheel.
            # Resolve all other dependencies from PyPI, not the restricted PyTorch index.
            - python -m pip install --index-url https://pypi.org/simple -c requirements/requirements_docs.txt "https://download-r2.pytorch.org/whl/cpu/torch-2.10.0%2Bcpu-cp310-cp310-manylinux_2_28_x86_64.whl#sha256=a280ffaea7b9c828e0c1b9b3bd502d9b6a649dc9416997b69b84544bd469f215"
            - python -m pip install -c requirements/requirements_docs.txt torch-geometric==2.8.1 torch-scatter==2.1.2 torch-sparse==0.6.18 --only-binary=torch-scatter,torch-sparse -f https://data.pyg.org/whl/torch-2.10.0+cpu.html

        post_install:
            - python -m pip check
            # Fail early if the required syntax-highlighting plugins are missing.
            - python -m pygments -S a11y-light -f html
            - python -m pygments -S a11y-dark -f html

python:
    install:
        - requirements: requirements/requirements_docs.txt
        # Install this checkout exactly once, not the latest release from PyPI.
        - method: pip
          path: .
