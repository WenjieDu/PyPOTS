# https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

formats:
    - htmlzip
    - pdf
    - epub

sphinx:
    configuration: docs/conf.py
    # Keep existing docstring warnings non-blocking until the warning backlog is resolved.
    fail_on_warning: false

build:
    os: ubuntu-22.04

    tools:
        python: "3.10"

    jobs:
        pre_install:
            # Match the minimum-Python CI CPU PyTorch version; install before the PyG extensions.
            - python -m pip install torch==2.3.0+cpu --index-url https://download.pytorch.org/whl/cpu
            - python -m pip install -c requirements/requirements_docs.txt torch-geometric==2.8.1 torch-scatter==2.1.2 torch-sparse==0.6.18 --only-binary=torch-scatter,torch-sparse -f https://data.pyg.org/whl/torch-2.3.0+cpu.html

        post_install:
            - python -m pip check
            # Fail early if the required syntax-highlighting plugins are missing.
            - python -c "from pygments.styles import get_style_by_name; get_style_by_name('a11y-light'); get_style_by_name('a11y-dark')"

python:
    install:
        - requirements: requirements/requirements_docs.txt
        # Install this checkout exactly once, not the latest release from PyPI.
        - method: pip
          path: .
